<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Search Inventory</title>
</head>
<body>
    <h2>Пошук пристрою</h2>

    <form action="/search" method="POST">
        <label for="id">ID предмета:</label>
        <input type="text" id="id" name="id" required><br><br>

        <label for="has_photo">Показати фото:</label>
        <input type="checkbox" id="has_photo" name="has_photo"><br><br>

        <button type="submit">Шукати</button>
    </form>
</body>
</html>
